name: Test plugins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Plugin test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt
      - run: python -m pip install -r scripts/requirements-validation.txt
      - run: python tests/test-validation-workflow.py

  sharing:
    name: ${{ matrix.plugin }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [diff-sharing, test-report-sharing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run plugin shell tests
        shell: bash
        run: |
          for test in plugins/${{ matrix.plugin }}/tests/test-*.sh; do
            bash "$test"
          done
      - run: python3 tests/test-report-launchers.py "${{ matrix.plugin }}"
      - run: python3 tests/test-report-python.py "${{ matrix.plugin }}"
      - run: python3 tests/test-report-snapshots.py

  android-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/android-status/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            tests/android-status/test-*.py
            plugins/qemu-guests/tests/test-*.py
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.0
      - run: npm ci --prefix scripts/android-status
      - run: npm run build --prefix scripts/android-status
      - name: Check generated assets
        run: git diff --exit-code -- plugins/android-emulator-profile/templates plugins/android-emulator-profile/scripts/android_probe.py plugins/android-device-lock/templates plugins/android-device-lock/scripts/android_probe.py
      - run: npm test --prefix scripts/android-status
      - run: uv run --script tests/android-status/test-status.py
      - run: uv run --with playwright==1.62.0 playwright install --with-deps chromium
      - run: uv run --script tests/android-status/test-panels.py
      - run: bash plugins/android-emulator-profile/tests/test-start-avd-docker.sh
      - run: bash plugins/android-emulator-profile/tests/test-install-sdk.sh
      - run: python3 plugins/android-emulator-profile/tests/test-profile-controller.py
      - run: python3 plugins/android-emulator-profile/tests/test-command-tree.py
      - run: bash plugins/android-device-lock/tests/test-device-lock.sh
      - run: python3 plugins/android-device-lock/tests/test-controller.py

  qemu-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/qemu-guests/ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            tests/android-status/test-*.py
            plugins/qemu-guests/tests/test-*.py
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.0
      - run: npm ci --prefix plugins/qemu-guests/ui
      - run: npm run build --prefix plugins/qemu-guests/ui
      - run: git diff --exit-code -- plugins/qemu-guests/templates/status-panel.html
      - run: npm test --prefix plugins/qemu-guests/ui
      - run: uv run --script plugins/qemu-guests/tests/test-status.py
      - run: uv run --with playwright==1.62.0 playwright install --with-deps chromium
      - run: uv run --script plugins/qemu-guests/tests/test-status-panel.py
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Verify upstream gvproxy lifecycle
        run: |
          source plugins/qemu-guests/scripts/vm-utils.sh
          install_gvproxy
          export GVPROXY_BINARY="$(gvproxy_binary)"
          python3 plugins/qemu-guests/tests/test-gvproxy-lifecycle.py
          python3 plugins/qemu-guests/tests/test-vm-lifecycle.py
      - run: bash plugins/qemu-guests/tests/test-port-ranges.sh
      - run: python -m pip install -r plugins/qemu-guests/scripts/requirements-guests.txt
      - run: python3 plugins/qemu-guests/tests/test-work-guests.py
      - run: python3 plugins/qemu-guests/tests/test-whpx-runtime.py
      - run: python3 plugins/qemu-guests/tests/test-guest-panel.py
      - run: python3 plugins/qemu-guests/tests/test-gvproxy-control.py
      - run: python3 plugins/qemu-guests/tests/test-vm-state.py
      - run: python3 plugins/qemu-guests/tests/test-vm-transitions.py
      - run: python3 plugins/qemu-guests/tests/test-vm-shell-handoff.py
      - run: bash plugins/qemu-guests/tests/test-vm-utils.sh
      - run: bash plugins/qemu-guests/tests/test-linux-testcontainers.sh
      - run: bash plugins/qemu-guests/tests/test-apk-mirror-selection.sh
      - run: bash plugins/qemu-guests/tests/test-sync-workspace.sh
      - run: bash plugins/qemu-guests/tests/test-build-docker-proxy.sh

  test-environments:
    name: Test environment protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r plugins/qemu-guests/scripts/requirements-guests.txt
      - run: python plugins/qemu-guests/tests/test-test-environment.py
      - run: python plugins/qemu-guests/tests/test-test-environment-ownership.py
      - run: python plugins/qemu-guests/tests/test-linux-transport.py
      - run: python plugins/qemu-guests/tests/test-desktop-provisioning.py
      - run: python plugins/qemu-guests/tests/test-project-setup-hooks.py
      - run: python plugins/qemu-guests/tests/test-environment-owner.py
      - run: python plugins/qemu-guests/tests/test-initialization-snapshot.py
      - run: python plugins/qemu-guests/tests/test-transport-cleanup.py
      - run: python plugins/qemu-guests/tests/test-environment-cli.py
      - run: python plugins/qemu-guests/tests/test-cancellation.py
      - run: python plugins/qemu-guests/tests/test-worker-protocol.py
      - run: node --test plugins/qemu-guests/tests/test-appium-run.cjs plugins/qemu-guests/tests/test-macos-autologin.cjs

  windows-msys2-path:
    name: Windows MSYS2 path regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify native emulator profile controller
        run: python plugins/android-emulator-profile/tests/test-profile-controller.py
      - uses: msys2/setup-msys2@v2
        with:
          location: C:\
          release: false
          msystem: UCRT64
          install: xorriso
      - name: Verify Git Bash with separate MSYS2 fallback tools
        shell: bash
        run: |
          test "$(cygpath -m /usr/bin/bash.exe)" = 'C:/Program Files/Git/usr/bin/bash.exe'
          test -x /c/msys64/usr/bin/bash.exe
          test -x /c/msys64/usr/bin/xorriso.exe
          bash plugins/qemu-guests/tests/test-msys2-path.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native Python to Git Bash ownership handoffs
        shell: pwsh
        env:
          BASH_TEST_BINARY: C:\Program Files\Git\bin\bash.exe
          PYTHONDONTWRITEBYTECODE: '1'
        run: python plugins/qemu-guests/tests/test-vm-shell-handoff.py

  windows-runtime:
    name: Windows native ownership and reports
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python plugins/android-emulator-profile/tests/test-command-tree.py
      - run: python plugins/qemu-guests/tests/test-vm-state.py
      - run: python -m pip install -r plugins/qemu-guests/scripts/requirements-guests.txt
      - run: python plugins/qemu-guests/tests/test-work-guests.py
      - run: python plugins/qemu-guests/tests/test-whpx-runtime.py
      - run: python plugins/qemu-guests/tests/test-guest-panel.py
      - run: python tests/test-report-python.py
      - run: python tests/test-report-snapshots.py
      - run: python tests/test-report-launchers.py

  windows-device-lock:
    name: Windows device lock controller
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python plugins/android-device-lock/tests/test-controller.py

  docker-proxy:
    name: QEMU Docker proxy Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/qemu-guests/scripts/docker-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/qemu-guests/scripts/docker-proxy/go.mod
          cache: true
          cache-dependency-path: plugins/qemu-guests/scripts/docker-proxy/go.sum
      - run: go test -race ./...

  linux-container:
    name: QEMU unprivileged container runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build non-root QEMU runtime
        uses: docker/build-push-action@v6
        with:
          context: plugins/qemu-guests
          file: plugins/qemu-guests/container/Dockerfile
          tags: qemu-runtime-test
          load: true
          cache-from: type=gha,scope=qemu-runtime
          cache-to: type=gha,mode=max,scope=qemu-runtime
      - name: Verify TCG without privileges, KVM, or a host Docker socket
        run: |
          docker run --rm --init -i --network none --cap-drop=ALL --security-opt=no-new-privileges \
            qemu-runtime-test bash -s < plugins/qemu-guests/tests/test-container-runtime.sh
