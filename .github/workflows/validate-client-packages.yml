name: Validate client packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-client-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Codex and Claude package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt
      - run: python -m pip install -r scripts/requirements-validation.txt
      - run: python tests/test-plugin-packages.py
      - run: bash tests/test-build-plugin-cli.sh
      - name: Generate and validate both distributions
        run: |
          bash scripts/build-codex-plugin-package.sh --all --output-dir "${RUNNER_TEMP}/me.codex"
          bash scripts/build-claude-plugin-package.sh --all --output-dir "${RUNNER_TEMP}/me.claude"
          python scripts/validate-plugin-packages.py --client codex "${RUNNER_TEMP}/me.codex"
          python scripts/validate-plugin-packages.py --client claude "${RUNNER_TEMP}/me.claude"
          python scripts/validate-generated-codex-skills.py "${RUNNER_TEMP}/me.codex"

