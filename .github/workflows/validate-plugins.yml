name: Validate portable plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt
      - name: Test both distributions
        run: |
          python tests/test-plugin-packages.py
          bash tests/test-build-plugin-cli.sh
