name: Validate QEMU status panel

on:
  pull_request:
    paths:
      - 'plugins/qemu-alpine-docker/**'
      - 'scripts/build-codex-plugin-package.sh'
      - 'scripts/validate-generated-codex-skills.py'
      - 'scripts/build-plugin-packages.py'
      - 'scripts/validate-plugin-packages.py'
      - 'tests/test-plugin-packages.py'
      - 'tests/test-build-plugin-cli.sh'
      - '.github/workflows/validate-qemu-status.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/qemu-alpine-docker/**'
      - 'scripts/build-codex-plugin-package.sh'
      - 'scripts/validate-generated-codex-skills.py'
      - 'scripts/build-plugin-packages.py'
      - 'scripts/validate-plugin-packages.py'
      - 'tests/test-plugin-packages.py'
      - 'tests/test-build-plugin-cli.sh'
      - '.github/workflows/validate-qemu-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --prefix plugins/qemu-alpine-docker/ui
      - run: npm run build --prefix plugins/qemu-alpine-docker/ui
      - run: git diff --exit-code -- plugins/qemu-alpine-docker/templates/status-panel.html
      - run: npm test --prefix plugins/qemu-alpine-docker/ui
      - run: uv run --script plugins/qemu-alpine-docker/tests/test-status.py
      - run: uv run --with playwright==1.62.0 playwright install --with-deps chromium
      - run: uv run --script plugins/qemu-alpine-docker/tests/test-status-panel.py
      - run: bash plugins/qemu-alpine-docker/tests/test-vm-utils.sh
      - run: bash plugins/qemu-alpine-docker/tests/test-linux-testcontainers.sh
      - run: bash plugins/qemu-alpine-docker/tests/test-apk-mirror-selection.sh
      - run: bash plugins/qemu-alpine-docker/tests/test-sync-workspace.sh
      - run: uv run --with PyYAML==6.0.3 --with jsonschema==4.25.1 python tests/test-plugin-packages.py
      - run: bash tests/test-build-plugin-cli.sh
      - name: Validate generated Codex skills
        run: |
          bash scripts/build-codex-plugin-package.sh --all --output-dir "${RUNNER_TEMP}/me.codex"
          uv run --with PyYAML==6.0.3 python scripts/validate-generated-codex-skills.py "${RUNNER_TEMP}/me.codex"

  linux-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root QEMU runtime
        run: docker build -f plugins/qemu-alpine-docker/container/Dockerfile -t qemu-runtime-test plugins/qemu-alpine-docker
      - name: Verify TCG without privileges, KVM, or a host Docker socket
        run: |
          docker run --rm --init -i --network none --cap-drop=ALL --security-opt=no-new-privileges \
            qemu-runtime-test bash -s < plugins/qemu-alpine-docker/tests/test-container-runtime.sh
