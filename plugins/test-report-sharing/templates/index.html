<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Test Report</h1>
            <p>Generated on {{GENERATION_TIME}}</p>
        </div>

        <div class="section">
            <h2>📊 Test Results</h2>
            <p>{{TEST_RESULTS_CONTENT}}</p>
        </div>

        <div class="section">
            <h2>🎬 E2E Recordings</h2>
            <p>{{RECORDINGS_CONTENT}}</p>
        </div>

        <div class="section">
            <h2>📝 Code Diff</h2>
            <p>{{DIFF_CONTENT}}</p>
        </div>

        <div class="footer">
            <p>Generated by test-report-sharing plugin</p>
        </div>
    </div>
</body>
</html>
