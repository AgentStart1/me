<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PANEL_TITLE</title>
<style>
:root{color-scheme:light dark;--bg:#f6f8fb;--card:#fff;--text:#202b3d;--muted:#65738a;--border:#e0e7ef;--accent:#2066ce;--good:#187453;--warn:#94620e;--bad:#b23949} :root[data-theme="dark"]{--bg:#141a24;--card:#202a38;--text:#eaf0fa;--muted:#a9b8cd;--border:#354358;--accent:#8bb8ff;--good:#70dcb0;--warn:#f2c379;--bad:#ff9eaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font-sans,system-ui,sans-serif)}main{max-width:1150px;margin:auto;padding:24px}header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px}header{margin-bottom:22px}h1{font-size:24px;letter-spacing:-.5px;margin:0}h2{font-size:15px;margin:0}p{margin:5px 0;color:var(--muted)}button,input{font:inherit;border:1px solid var(--border);border-radius:8px;padding:7px 11px;background:var(--card);color:var(--text)}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label,.small{color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.section{background:var(--card);border:1px solid var(--border);border-radius:12px}.metric{padding:17px}.metric strong{display:block;font-size:27px;line-height:1.5}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}.section{margin-top:18px;overflow:hidden}.toolbar{padding:18px}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:500;color:var(--muted);background:var(--bg)}th,td{padding:13px 18px;border-top:1px solid var(--border);vertical-align:top}td{overflow-wrap:anywhere;max-width:270px}td small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--border);border-radius:18px;padding:3px 8px}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.online,.free{color:var(--good)}.held,.booting{color:var(--accent)}.expired,.offline,.unauthorized,.unknown,.unavailable{color:var(--warn)}.notice{padding:12px 14px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:8px;margin:14px 0;background:var(--card);color:var(--warn)}.error{color:var(--bad);border-left-color:var(--bad)}.empty{padding:36px 18px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:11px}.screen-body{padding:20px;background:var(--bg);text-align:center}.screen-body img{max-height:560px;max-width:100%;object-fit:contain;border:1px solid var(--border);border-radius:8px}.capture{font-size:12px;color:var(--accent);white-space:nowrap}.clock-note{margin:0;padding:0 18px 14px;color:var(--muted);font-size:11px}[hidden]{display:none!important}@media(max-width:650px){main{padding:14px}header{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.toolbar{flex-wrap:wrap}.metric strong{font-size:23px}.table-scroll{max-width:100%}td,th{padding:12px}}
</style></head><body><main><header><div><h1>PANEL_TITLE</h1><p id="subtitle"></p></div><div class="controls"><label><input id="auto" type="checkbox"> Auto-refresh · 10s</label><button id="refresh" disabled>Refresh</button></div></header>
<div id="error" class="notice error" role="alert" hidden></div><div id="loading" class="empty" role="status">Waiting for Android status…</div>
<div id="dashboard" hidden><section id="metrics" class="metrics" aria-label="Status summary"></section><div id="warnings" role="status"></div><section class="section"><div class="toolbar"><div><h2 id="list-title"></h2><p id="list-detail" class="small"></p></div><label>Filter <input id="filter" type="search" placeholder="Name or serial" autocomplete="off"></label></div><div id="empty" class="empty" hidden></div><div id="table" class="table-scroll"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div><p id="clock-note" class="clock-note" hidden></p></section></div>
<section id="screen" class="section" hidden aria-label="Emulator screen"><div class="toolbar"><div><h2 id="screen-title">Screen preview</h2><p id="screen-detail" class="small"></p></div><button id="close-screen">Close preview</button></div><div class="screen-body"><img id="screenshot" alt="" hidden><p id="screen-message" role="status"></p></div></section>
<footer><span id="observed" aria-live="polite">No status received</span><span id="footnote"></span></footer></main><script type="module">/* PANEL_SCRIPT */</script></body></html>
